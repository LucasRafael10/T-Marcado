<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Confirmar e-mail — Tá Marcado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Franklin:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/refinements.css">
  <link rel="stylesheet" href="css/recovery.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body data-mode="verify" class="login-body recovery-body">
  <main class="login-shell recovery-shell">
    <a class="login-logo recovery-logo" href="index.html"><span class="dot"></span>Tá Marcado</a>
    <section class="login-card recovery-card">
      <h1 class="login-title">Confirmando seu e-mail</h1>
      <p id="message" class="recovery-message" role="status" aria-live="polite">Aguarde…</p>
      <form id="plannerForm" hidden>
        <p>Você recebeu um convite de cerimonialista. Escolha sua senha pessoal.</p>
        <label class="field-label" for="password">Senha</label><input class="field-input" id="password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
        <label class="field-label" for="confirm">Confirme a senha</label><input class="field-input" id="confirm" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
        <button class="big-btn primary">Ativar meu acesso</button>
      </form>
      <p><a href="login.html">Entrar na minha conta</a> · <a href="reenviar-confirmacao.html">Solicitar outro link</a></p>
    </section>
    <p class="support-contact">
      <a class="support-contact-button" href="mailto:tamarcado10@gmail.com?subject=D%C3%BAvidas%20sobre%20o%20T%C3%A1%20Marcado">Dúvidas? Entre em contato</a>
      <small>tamarcado10@gmail.com</small>
    </p>
  </main>
  <script src="js/confirm-verification.js"></script>
</body>
</html>
