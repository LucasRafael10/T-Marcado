<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Tá Marcado</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Franklin:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/refinements.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="login-body">

<div class="login-shell">
  <div class="login-logo"><span class="dot"></span>Tá Marcado</div>

  

  <div class="login-card"><h1 class="login-title">Seu evento começa aqui</h1>
    <div class="role-tabs">
      <button type="button" class="role-tab active" id="tabNoiva">Organizador(a)<br>do evento</button>
      <button type="button" class="role-tab" id="tabCerimonialista">Cerimonialista</button>
    </div>

    <p class="login-sub" id="loginSub">Entre para acompanhar as confirmações do seu evento.</p>

    <form id="loginForm">
      <label class="field-label" for="emailInput">E-mail</label>
      <input class="field-input" type="email" id="emailInput" autocomplete="username" placeholder="voce@email.com" required>

      <label class="field-label" for="senhaInput">Senha</label>
      <input class="field-input" type="password" id="senhaInput" autocomplete="current-password" placeholder="••••••••" required>

      <div class="login-error" id="loginError">—</div>

      <button type="submit" class="big-btn primary">Entrar</button>
    </form>
  </div>

  <p class="login-footnote"><a href="esqueci-senha.html">Esqueci minha senha</a> · <a href="reenviar-confirmacao.html">Reenviar confirmação</a></p>
  <p class="login-footnote">Ainda não tem conta? <a href="index.html">Criar meu evento</a></p>
</div>

<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
