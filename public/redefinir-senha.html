<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Nova senha — Tá Marcado</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <div class="login-logo">Tá Marcado</div>
      <div class="login-card">
        <h1>Crie uma nova senha</h1>
        <p class="login-sub">
          Use pelo menos 8 caracteres. Você precisará entrar novamente nos seus
          dispositivos.
        </p>
        <form id="recoveryForm">
          <label class="field-label" for="password">Nova senha</label
          ><input
            class="field-input"
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="256"
            required
          /><label class="field-label" for="confirm">Confirme a senha</label
          ><input
            class="field-input"
            id="confirm"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="256"
            required
          /><button class="big-btn primary" type="submit">
            Salvar nova senha
          </button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
      </div>
      <p class="login-footnote">
        <a href="login.html">Entrar</a> ·
        <a href="esqueci-senha.html">Solicitar outro link</a>
      </p>
    </main>
    <script src="js/recovery.js"></script>
  </body>
</html>
